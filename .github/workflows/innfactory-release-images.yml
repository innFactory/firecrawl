# innFactory-only workflow (lives on the innfactory-image-build branch, NOT on
# main, so the upstream fork-sync never conflicts). Builds the three
# self-host images companyGPT deploys (modules/websearch) from an upstream
# release tag and pushes them to ghcr.io/innfactory/<image>:<tag>.
#
# Trigger: push to this branch builds DEFAULT_TAG (workflows on non-default
# branches are not dispatchable until they ran once). After that:
#   gh workflow run innfactory-release-images.yml -R innFactory/firecrawl \
#     --ref innfactory-image-build -f tag=v2.12.0
name: innFactory Release Images

on:
  push:
    branches:
      - innfactory-image-build
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream release tag to build (e.g. v2.11.0)"
        required: true
        type: string

env:
  DEFAULT_TAG: v2.11.0

permissions:
  contents: read
  packages: write

concurrency:
  group: innfactory-release-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: firecrawl
            context: ./apps/api
          - image: playwright-service
            context: ./apps/playwright-service-ts
          - image: nuq-postgres
            context: ./apps/nuq-postgres
    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ inputs.tag || env.DEFAULT_TAG }}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # AKS node pools are linux/amd64 only — no multi-arch needed.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/innfactory/${{ matrix.image }}:${{ steps.tag.outputs.tag }}
