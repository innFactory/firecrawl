# innFactory-only workflow (lives on the innfactory-image-build branch, NOT on
# main, so the upstream fork-sync never conflicts). Builds the three
# self-host images companyGPT deploys (modules/websearch) from an upstream
# release tag and pushes them to ghcr.io/innfactory/<image>:<tag>.
#
# Trigger: push to this branch builds DEFAULT_TAG (workflows on non-default
# branches are not dispatchable until they ran once). After that:
#   gh workflow run innfactory-release-images.yml -R innFactory/firecrawl \
#     --ref innfactory-image-build -f tag=v2.12.0 -f suffix=-inn.1 -f node=22.23.4
#
# Node base image: the upstream Dockerfiles use floating tags (node:22-slim,
# at v2.11.0 playwright-service-ts even node:18-slim, EOL). The build pins
# FROM node:<major>-slim to node:<NODE>-slim so a rebuild is reproducible and
# carries a known Node patch level (Node.js Security Release 2026-10-21:
# 22.23.4). The published tag is <upstream tag><suffix>, so a patched rebuild
# never overwrites the plain upstream tag companyGPT may still pin.
name: innFactory Release Images

on:
  push:
    branches:
      - innfactory-image-build
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream release tag to build (e.g. v2.11.0)"
        required: true
        type: string
      suffix:
        description: "Suffix appended to the published tag (e.g. -inn.1)"
        required: false
        type: string
      node:
        description: "Node version pinned in the Dockerfiles (e.g. 22.23.4)"
        required: false
        type: string

env:
  DEFAULT_TAG: v2.11.0
  DEFAULT_SUFFIX: -inn.1
  DEFAULT_NODE: 22.23.4

permissions:
  contents: read
  packages: write

concurrency:
  group: innfactory-release-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: firecrawl
            context: ./apps/api
          - image: playwright-service
            context: ./apps/playwright-service-ts
          - image: nuq-postgres
            context: ./apps/nuq-postgres
    steps:
      - name: Resolve tag
        id: tag
        run: |
          echo "tag=${{ inputs.tag || env.DEFAULT_TAG }}" >> "$GITHUB_OUTPUT"
          echo "suffix=${{ inputs.suffix || env.DEFAULT_SUFFIX }}" >> "$GITHUB_OUTPUT"
          echo "node=${{ inputs.node || env.DEFAULT_NODE }}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Pin Node base image
        if: matrix.image != 'nuq-postgres'
        run: |
          f="${{ matrix.context }}/Dockerfile"
          sed -i -E 's#^FROM node:[0-9]+-(slim|alpine)#FROM node:${{ steps.tag.outputs.node }}-\1#' "$f"
          grep -nE '^FROM node:' "$f"
          grep -qE '^FROM node:${{ steps.tag.outputs.node }}-' "$f"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # AKS node pools are linux/amd64 only — no multi-arch needed.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/innfactory/${{ matrix.image }}:${{ steps.tag.outputs.tag }}${{ steps.tag.outputs.suffix }}
